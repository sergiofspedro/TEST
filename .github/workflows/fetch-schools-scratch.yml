name: Fetch Schools Data (scratch)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch equipEscolares full data
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json

          url = ('https://infosig.cm-matosinhos.pt/arcgis/rest/services/AMB_BairrosDigitais/'
                 'FeatureServer/1/query?where=1%3D1&outFields=*&f=geojson')
          req = urllib.request.Request(url, headers={'User-Agent': 'MOVESIT-scratch/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode('utf-8'))
          features = data.get('features', [])
          print(f'Fetched {len(features)} features', flush=True)

          rows = [f['properties'] for f in features]
          with open('schools_data.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, ensure_ascii=False, indent=2)
          print('Wrote schools_data.json', flush=True)
          PYEOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schools_data.json
          git commit -m "Scratch: fetch full equipEscolares data" || echo "nothing to commit"
          git push
