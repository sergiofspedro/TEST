name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embed parish boundary GeoJSON
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, re, time, sys

          PARISHES = [
              'custóias', 'guifões', 'leça do balio', 'matosinhos',
              'leça da palmeira', 'são mamede de infesta', 'perafita',
              'lavra', 'santa cruz do bispo', 'senhora da hora'
          ]

          results = {}
          for name in PARISHES:
              url = ('https://geoapi.pt/municipio/matosinhos/freguesia/'
                     + urllib.parse.quote(name) + '?json=1')
              try:
                  req = urllib.request.Request(
                      url, headers={'User-Agent': 'MOVESIT-deploy/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      content = r.read().decode('utf-8')
                  content = re.sub(r':,', ':null,', content)
                  data = json.loads(content)
                  gj = data.get('geojson')
                  if gj and gj.get('geometry', {}).get('coordinates'):
                      results[name] = gj
                      print(f'✓ {name}', flush=True)
                  else:
                      print(f'⚠ {name}: no geometry', flush=True)
              except Exception as e:
                  print(f'✗ {name}: {e}', flush=True)
              time.sleep(0.4)

          if not results:
              print('No boundaries fetched — skipping injection', flush=True)
              sys.exit(0)

          geojson_js = 'var BOUNDARY_GEOJSON = ' + json.dumps(results, ensure_ascii=False) + ';'

          with open('matosinhos_map.html', 'r', encoding='utf-8') as f:
              html = f.read()

          html = html.replace('var BOUNDARY_GEOJSON = {};', geojson_js, 1)

          with open('matosinhos_map.html', 'w', encoding='utf-8') as f:
              f.write(html)

          print(f'Injected {len(results)}/10 parish boundaries into HTML', flush=True)
          PYEOF

      - name: Embed GDB layers (Bairros, Habitação Social, Equipamentos, Associações)
        run: |
          pip install geopandas --quiet
          python3 - << 'PYEOF'
          import geopandas as gpd, json, sys, subprocess, warnings
          warnings.filterwarnings('ignore')

          subprocess.run(['cp', '-r', 'Files SIG CMM', '/tmp/layers.gdb'], check=True)

          def read_layer(name):
              return gpd.read_file('/tmp/layers.gdb', layer=name).to_crs('EPSG:4326')

          def to_fc(features):
              return {'type': 'FeatureCollection', 'features': features}

          def feat(geom, props):
              return {'type': 'Feature', 'properties': props, 'geometry': geom.__geo_interface__}

          # BairrosDigitais
          gdf = read_layer('BairrosDigitais')
          features = [feat(r['geometry'], {'designacao': str(r.get('Designação') or ''), 'freguesia': str(r.get('Freguesia') or '')})
                      for _, r in gdf.iterrows()]
          bairros_js = 'var BAIRROS_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'BairrosDigitais: {len(features)} features', flush=True)

          # HabitacaoSocial
          gdf = read_layer('HabitacaoSocial')
          features = [feat(r['geometry'], {
              'descricao': str(r.get('Descrição') or ''),
              'morada':    str(r.get('Morada') or ''),
              'freguesia': str(r.get('Freguesia') or ''),
              'n_fogos':   str(r.get('N_º_de_fogos') or '')
          }) for _, r in gdf.iterrows()]
          habitacao_js = 'var HABITACAO_SOCIAL_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'HabitacaoSocial: {len(features)} features', flush=True)

          # Equipamentos
          gdf = read_layer('Equipamentos')
          features = [feat(r['geometry'], {
              'designacao': str(r.get('Designação_do_equipamento') or ''),
              'dominio':    str(r.get('Domínio_do_equipamento') or ''),
              'categoria':  str(r.get('Categoria') or ''),
              'morada':     str(r.get('Morada') or ''),
              'freguesia':  str(r.get('Freguesia') or '')
          }) for _, r in gdf.iterrows()]
          equipamentos_js = 'var EQUIPAMENTOS_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'Equipamentos: {len(features)} features', flush=True)

          # Associacoes
          gdf = read_layer('Associacoes')
          features = [feat(r['geometry'], {
              'designacao': str(r.get('Designação_da_associação') or ''),
              'dominio':    str(r.get('Domínio_da_associação') or ''),
              'morada':     str(r.get('Morada') or ''),
              'freguesia':  str(r.get('Freguesia') or '')
          }) for _, r in gdf.iterrows()]
          associacoes_js = 'var ASSOCIACOES_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'Associacoes: {len(features)} features', flush=True)

          with open('matosinhos_map.html', 'r', encoding='utf-8') as f:
              html = f.read()
          html = html.replace('var BAIRROS_GEOJSON = {};',          bairros_js,      1)
          html = html.replace('var HABITACAO_SOCIAL_GEOJSON = {};',  habitacao_js,    1)
          html = html.replace('var EQUIPAMENTOS_GEOJSON = {};',      equipamentos_js, 1)
          html = html.replace('var ASSOCIACOES_GEOJSON = {};',       associacoes_js,  1)
          with open('matosinhos_map.html', 'w', encoding='utf-8') as f:
              f.write(html)

          print('All GDB layers injected into HTML.', flush=True)
          PYEOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
