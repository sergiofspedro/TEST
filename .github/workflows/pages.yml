name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embed GDB layers (Freguesias, Bairros, Bairros Sociais, Equipamentos, Associações, Áreas Ajardinadas)
        run: |
          pip install geopandas --quiet
          python3 - << 'PYEOF'
          import geopandas as gpd, json, sys, subprocess, warnings, math
          warnings.filterwarnings('ignore')

          subprocess.run(['cp', '-r', 'Files SIG CMM', '/tmp/layers.gdb'], check=True)

          def read_layer(name):
              return gpd.read_file('/tmp/layers.gdb', layer=name).to_crs('EPSG:4326')

          def to_fc(features):
              return {'type': 'FeatureCollection', 'features': features}

          def feat(geom, props):
              return {'type': 'Feature', 'properties': props, 'geometry': geom.__geo_interface__}

          def s(v):
              if v is None or (isinstance(v, float) and math.isnan(v)):
                  return ''
              return str(v).strip()

          def num(v):
              try:
                  f = float(v)
                  return None if math.isnan(f) else f
              except (TypeError, ValueError):
                  return None

          # Limites_Freguesias → BOUNDARY_GEOJSON (parish boundaries, keyed by lowercase name)
          FREGUESIA_KEY = {
              'matosinhos': 'matosinhos',
              'senhora da hora': 'senhora da hora',
              's. mamede de infesta': 'são mamede de infesta',
              'guifões': 'guifões',
              'custóias': 'custóias',
              'santa cruz do bispo': 'santa cruz do bispo',
              'leça do balio': 'leça do balio',
              'perafita': 'perafita',
              'lavra': 'lavra',
              'leça da palmeira': 'leça da palmeira',
          }
          gdf = read_layer('Limites_Freguesias')
          boundaries = {}
          for _, r in gdf.iterrows():
              raw = s(r.get('Designaç'))
              key = FREGUESIA_KEY.get(raw.lower())
              if not key:
                  print(f'⚠ unmapped freguesia: {raw}', flush=True)
                  continue
              boundaries[key] = feat(r['geometry'], {'nome': raw})
          boundary_js = 'var BOUNDARY_GEOJSON = ' + json.dumps(boundaries, ensure_ascii=False) + ';'
          print(f'Limites_Freguesias: {len(boundaries)}/10 parishes', flush=True)

          # Limites_bairros → BAIRROS_GEOJSON
          gdf = read_layer('Limites_bairros')
          features = [feat(r['geometry'], {'designacao': s(r.get('Designacao'))}) for _, r in gdf.iterrows()]
          bairros_js = 'var BAIRROS_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'Limites_bairros: {len(features)} features', flush=True)

          # Limites_BairrosSociais → HABITACAO_SOCIAL_GEOJSON
          gdf = read_layer('Limites_BairrosSociais')
          features = [feat(r['geometry'], {
              'descricao': s(r.get('Descriçã')),
              'morada':    s(r.get('Morada')),
              'freguesia': s(r.get('Freguesia')),
              'n_fogos':   s(r.get('N_FOGOS')),
              'ano_const': s(r.get('ANO_CONST')),
          }) for _, r in gdf.iterrows()]
          habitacao_js = 'var HABITACAO_SOCIAL_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'Limites_BairrosSociais: {len(features)} features', flush=True)

          # Equipamentos
          gdf = read_layer('Equipamentos')
          features = [feat(r['geometry'], {
              'designacao': s(r.get('nomeequip')),
              'dominio':    s(r.get('classe')),
              'categoria':  s(r.get('categoria')),
              'morada':     s(r.get('morada')),
              'freguesia':  s(r.get('freguesia')),
          }) for _, r in gdf.iterrows()]
          equipamentos_js = 'var EQUIPAMENTOS_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'Equipamentos: {len(features)} features', flush=True)

          # Associacoes
          gdf = read_layer('Associacoes')
          features = [feat(r['geometry'], {
              'designacao': s(r.get('Designaç')),
              'morada':     s(r.get('Morada')),
              'freguesia':  s(r.get('Freguesia')),
          }) for _, r in gdf.iterrows()]
          associacoes_js = 'var ASSOCIACOES_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'Associacoes: {len(features)} features', flush=True)

          # Area_Ajardinada → AREAS_AJARDINADAS_GEOJSON
          gdf = read_layer('Area_Ajardinada')
          features = [feat(r['geometry'], {
              'designacao': s(r.get('Designaç')),
              'freguesia':  s(r.get('Freguesia')),
              'area_m2':    num(r.get('Área__m2_')),
          }) for _, r in gdf.iterrows()]
          areas_js = 'var AREAS_AJARDINADAS_GEOJSON = ' + json.dumps(to_fc(features), ensure_ascii=False) + ';'
          print(f'Area_Ajardinada: {len(features)} features', flush=True)

          with open('matosinhos_map.html', 'r', encoding='utf-8') as f:
              html = f.read()
          html = html.replace('var BOUNDARY_GEOJSON = {};',          boundary_js,     1)
          html = html.replace('var BAIRROS_GEOJSON = {};',            bairros_js,      1)
          html = html.replace('var HABITACAO_SOCIAL_GEOJSON = {};',   habitacao_js,    1)
          html = html.replace('var EQUIPAMENTOS_GEOJSON = {};',       equipamentos_js, 1)
          html = html.replace('var ASSOCIACOES_GEOJSON = {};',        associacoes_js,  1)
          html = html.replace('var AREAS_AJARDINADAS_GEOJSON = {};',  areas_js,        1)
          with open('matosinhos_map.html', 'w', encoding='utf-8') as f:
              f.write(html)

          print('All GDB layers injected into HTML.', flush=True)
          PYEOF

      - name: Embed Zonas de Vizinhança (CMM ArcGIS pilot layer)
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json

          url = ('https://infosig.cm-matosinhos.pt/server/rest/services/AtividadesEconomicas/'
                 'MapServer/121/query?where=1%3D1&outFields=*&f=geojson')
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'MOVESIT-deploy/1.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read().decode('utf-8'))
              features = data.get('features', [])
              if features:
                  print('Sample properties:', json.dumps(features[0]['properties'], ensure_ascii=False), flush=True)
              geojson = {'type': 'FeatureCollection', 'features': features}
              print(f'Zonas de Vizinhança: {len(features)} features', flush=True)
          except Exception as e:
              geojson = {'type': 'FeatureCollection', 'features': []}
              print(f'⚠ Zonas de Vizinhança fetch failed: {e}', flush=True)

          js = 'var ZONAS_VIZINHANCA_GEOJSON = ' + json.dumps(geojson, ensure_ascii=False) + ';'
          with open('matosinhos_map.html', 'r', encoding='utf-8') as f:
              html = f.read()
          html = html.replace('var ZONAS_VIZINHANCA_GEOJSON = {};', js, 1)
          with open('matosinhos_map.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PYEOF

      - name: Embed MOVES-IT extra layers (CMM ArcGIS server)
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, re

          ARCGIS = 'https://infosig.cm-matosinhos.pt/arcgis/rest/services'
          SERVER = 'https://infosig.cm-matosinhos.pt/server/rest/services'

          # key -> list of layer URLs (more than one = merged into a single toggle,
          # per explicit request: 7+8 and 29+32 in AMB_LimpezaUrbana should be one button each).
          # NOTE: id 53 ("Equipamentos para Recolha de Resíduos - Total") was dropped from
          # 'ecopontos' — at 7,680 features (vs ~1,600/~1,000 for its siblings) it was ~87% of
          # ALL embedded MOVES-IT features and pushed the deploy past GitHub Pages' 10-minute
          # timeout. Its "Total" naming also suggests a broader waste-equipment rollup, not
          # specifically recycling points. Re-add if it's actually wanted — will need a
          # different approach (pagination / narrower outFields) to fit.
          LAYERS = {
              'bairrosDigitais':     [f'{ARCGIS}/AMB_BairrosDigitais/FeatureServer/5'],
              'jardinsParques':      [f'{ARCGIS}/AMB_BairrosDigitais/FeatureServer/2'],
              'redeHidrografica':    [f'{ARCGIS}/AMB_BairrosDigitais/FeatureServer/3'],
              'equip3idade':         [f'{ARCGIS}/AMB_BairrosDigitais/FeatureServer/0'],
              'equipEscolares':      [f'{ARCGIS}/AMB_BairrosDigitais/FeatureServer/1'],
              'baciasHidrograficas': [f'{ARCGIS}/AMB_AguasPluviais/FeatureServer/12'],
              'residuosVerdes':      [f'{ARCGIS}/AMB_LimpezaUrbana/FeatureServer/7',
                                       f'{ARCGIS}/AMB_LimpezaUrbana/FeatureServer/8'],
              'ecopontos':           [f'{ARCGIS}/AMB_LimpezaUrbana/FeatureServer/29',
                                       f'{ARCGIS}/AMB_LimpezaUrbana/FeatureServer/32'],
              'saude':               [f'{SERVER}/AtividadesEconomicas/MapServer/4'],
              'educacao':            [f'{SERVER}/AtividadesEconomicas/MapServer/6'],
              'desporto':            [f'{SERVER}/AtividadesEconomicas/MapServer/7'],
              'cultura':             [f'{SERVER}/AtividadesEconomicas/MapServer/8'],
              'solidariedade':       [f'{SERVER}/AtividadesEconomicas/MapServer/9'],
              'hidrografia':         [f'{SERVER}/AtividadesEconomicas/MapServer/10'],
              'linhaMetro':          [f'{SERVER}/AtividadesEconomicas/MapServer/24'],
              'estacoesMetro':       [f'{SERVER}/AtividadesEconomicas/MapServer/155'],
              'estacoesParagens':    [f'{ARCGIS}/CARTAHABIT_1Diagnostico/MapServer/1'],
              'infraestruturaCiclavel':    [f'{SERVER}/AtividadesEconomicas/MapServer/122'],
              'estacionamentoBicicletas':  [f'{SERVER}/AtividadesEconomicas/MapServer/124'],
              'patrimonioCultural':        [f'{SERVER}/AtividadesEconomicas/MapServer/162'],
              'areasArqueologicas':        [f'{SERVER}/AtividadesEconomicas/MapServer/165'],
          }

          # Pure ArcGIS bookkeeping — never used by the front-end tooltip picker, only bloat.
          DROP_FIELDS = re.compile(
              r'^(OBJECTID|OBJECTID_\d+|GlobalID|Shape__Length|Shape__Area|'
              r'Shape\.ST(Length|Area)\(\)|SHAPE\.ST(Length|Area)\(\))$', re.IGNORECASE)

          # Per-feature filters for layers whose ArcGIS source mixes in rows that shouldn't be
          # shown as-is. Keyed by LAYERS key; value is a predicate over a feature's `properties`
          # dict — keep the feature if it returns True. Fail open: if neither expected field is
          # present on a feature, keep it rather than risk silently dropping everything.
          def _estacoes_metro_existente(p):
              if 'OBSERVACOES' in p:
                  return p.get('OBSERVACOES') == 'Existente'
              if 'ESTADO_BD' in p:
                  return p.get('ESTADO_BD') == 1
              return True

          FEATURE_FILTERS = {
              # AtividadesEconomicas/155 is titled "Estações de Metro Existentes" at the source,
              # but still contains some non-existing entries (per user report) — the per-feature
              # OBSERVACOES/ESTADO_BD fields are the real ground truth, not the layer's aggregate
              # name. Sibling /157 ("Estações de Metro Projetadas") holds planned stations, which
              # we deliberately don't embed. If MOB_MetroDoPorto/0 ("Estações de Metro") ever
              # looks like a cleaner source, it's a candidate replacement — schema unverified,
              # not adopted here.
              'estacoesMetro': _estacoes_metro_existente,
          }

          def round_coords(coords):
              if isinstance(coords, (int, float)):
                  return round(coords, 6)
              return [round_coords(c) for c in coords]

          def simplify(feat):
              feat['properties'] = {k: v for k, v in feat['properties'].items() if not DROP_FIELDS.match(k)}
              geom = feat.get('geometry')
              if geom and geom.get('coordinates') is not None:
                  geom['coordinates'] = round_coords(geom['coordinates'])
              return feat

          def fetch_features(layer_url):
              url = layer_url + '/query?where=1%3D1&outFields=*&f=geojson'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'MOVESIT-deploy/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.loads(r.read().decode('utf-8'))
                  feats = [simplify(f) for f in data.get('features', [])]
                  print(f'  {layer_url}: {len(feats)} features', flush=True)
                  return feats
              except Exception as e:
                  print(f'  ⚠ {layer_url}: {e}', flush=True)
                  return []

          result = {}
          total_feats = 0
          for key, urls in LAYERS.items():
              feats = []
              for u in urls:
                  feats.extend(fetch_features(u))
              filt = FEATURE_FILTERS.get(key)
              if filt:
                  before = len(feats)
                  kept    = [f for f in feats if filt(f.get('properties') or {})]
                  dropped = [f for f in feats if f not in kept]
                  if kept:
                      feats = kept
                      if dropped:
                          names = [d['properties'].get('DESIGNACAO', '?') for d in dropped]
                          print(f'  {key}: filtered {before} -> {len(feats)} features '
                                f'(dropped: {", ".join(names)})', flush=True)
                  else:
                      print(f'  ⚠ {key}: filter would drop all {before} features — keeping unfiltered', flush=True)
              result[key] = {'type': 'FeatureCollection', 'features': feats}
              total_feats += len(feats)
              if feats:
                  print(f'{key}: {len(feats)} total | sample properties: '
                        + json.dumps(feats[0]["properties"], ensure_ascii=False), flush=True)
              else:
                  print(f'{key}: 0 features', flush=True)

          js = 'var EXTRA_LAYERS_DATA = ' + json.dumps(result, ensure_ascii=False) + ';'
          print(f'Total MOVES-IT extra features: {total_feats} | payload size: {len(js)} bytes', flush=True)
          with open('matosinhos_map.html', 'r', encoding='utf-8') as f:
              html = f.read()
          html = html.replace('var EXTRA_LAYERS_DATA = {};', js, 1)
          with open('matosinhos_map.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('Injected EXTRA_LAYERS_DATA', flush=True)
          PYEOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
